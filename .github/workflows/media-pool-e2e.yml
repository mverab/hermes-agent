name: media-pool-e2e
on:
  push:
    branches: ["wine2e/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - run: pip install starlette==0.46.2 uvicorn==0.34.3
      - run: npm install --no-save --no-audit --no-fund electron@40.10.2
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq xvfb
      - run: ./run.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: |
            results.txt
            server.log
